---
version: 2

updates:
  - package-ecosystem: "devcontainers"
    commit-message:
      include: "scope"
      prefix: ":dependabot: devcontainers"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    commit-message:
      include: "scope"
      prefix: ":dependabot: github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    commit-message:
      include: "scope"
      prefix: ":dependabot: npm"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "pre-commit"
    commit-message:
      include: "scope"
      prefix: ":dependabot: pre-commit"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
