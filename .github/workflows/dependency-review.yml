---
name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        id: harden_runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        id: dependency_review
        uses: actions/dependency-review-action@v5.0.0
        with:
          comment-summary-in-pr: true
          fail-on-severity: critical
          fail-on-scopes: runtime, development
