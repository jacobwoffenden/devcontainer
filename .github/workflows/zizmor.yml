---
name: Zizmor

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        id: harden_runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
