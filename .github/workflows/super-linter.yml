---
name: Super-Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
      pull-requests: write
      statuses: write
    steps:
      - name: Harden Runner
        id: harden_runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          VALIDATE_ZIZMOR: false # Zizmor is run from .github/workflows/zizmor.yml
